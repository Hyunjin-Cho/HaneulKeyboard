name: CI

on:
  push:
  pull_request:

env:
  CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
  SWIFT_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache

jobs:
  unsigned-build:
    name: Unsigned build (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build without code signing
        run: >-
          xcodebuild
          -project HaneulKeyboard.xcodeproj
          -scheme HaneulKeyboard
          -configuration ${{ matrix.configuration }}
          -derivedDataPath .build/DerivedData-${{ matrix.configuration }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify bundled licenses and notices
        run: >-
          python3 scripts/verify_license_resources.py
          .build/DerivedData-${{ matrix.configuration }}/Build/Products/${{ matrix.configuration }}/HaneulKeyboard.app
          .build/DerivedData-${{ matrix.configuration }}/Build/Products/${{ matrix.configuration }}/HaneulKeyboardIM.app

  core-tests:
    name: Core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift compiler
        run: swiftc --version
      - name: Run IME core tests
        run: bash scripts/run_ime_tests.sh
      - name: Audit registered Hangul dictionary
        run: python3 scripts/audit_phonetic_dictionary.py
      - name: Run update transport and trust tests (Debug and Release)
        run: bash scripts/run_updater_tests.sh
      - name: Run native onboarding input tests
        run: bash scripts/run_onboarding_tests.sh

  wordlist-smoke:
    name: Wordlist audit smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift compiler
        run: swiftc --version
      - name: Run wordlist smoke test
        run: bash scripts/audit_wordlist.sh --smoke

  # TODO: IMK 이벤트 판독을 순수 함수로 추출한 뒤 fake client로 NSEvent,
  # secure input, CapsLock 및 Shift+Space 경로를 통합 테스트한다.
