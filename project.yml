name: HaneulKeyboard
options:
  bundleIdPrefix: com.hyunjincho
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "2026.07"
    CURRENT_PROJECT_VERSION: "44"
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "YES"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application: Hyunjin Cho (6RH6FXY82P)"
      DEVELOPMENT_TEAM: 6RH6FXY82P
      CODE_SIGNING_REQUIRED: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  HaneulKeyboard:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: ACKNOWLEDGEMENTS.md
        buildPhase: resources
    dependencies:
      - target: HaneulKeyboardIM
        embed: false
    postBuildScripts:
      - name: "Embed HaneulKeyboardIM into Contents/Helpers"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/HaneulKeyboardIM.app
        script: |
          set -e
          HELPERS_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS_DIR"
          SRC="${BUILT_PRODUCTS_DIR}/HaneulKeyboardIM.app"
          if [ -d "$SRC" ]; then
            rm -rf "$HELPERS_DIR/HaneulKeyboardIM.app"
            cp -R "$SRC" "$HELPERS_DIR/"
            echo "Embedded HaneulKeyboardIM.app → $HELPERS_DIR/"
          else
            echo "WARN: HaneulKeyboardIM.app not found at $SRC"
          fi
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleName: HaneulKeyboard
        CFBundleDisplayName: HaneulKeyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright (c) 2026 Hyunjin Cho"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunjincho.haneulkeyboard
        CODE_SIGN_ENTITLEMENTS: HaneulKeyboard.entitlements

  HaneulKeyboardIM:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IMESources
      - path: Resources/IM
        buildPhase: resources
    info:
      path: Generated/IMInfo.plist
      properties:
        LSBackgroundOnly: true
        LSUIElement: true
        CFBundleName: HaneulKeyboardIM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright (c) 2026 Hyunjin Cho"
        NSPrincipalClass: NSApplication
        InputMethodConnectionName: com.hyunjincho.inputmethod.haneul_Connection
        InputMethodServerControllerClass: HaneulInputController
        TISIntendedLanguage: ko
        TICapsLockLanguageSwitchCapable: true
        TISIconIsTemplate: true
        tsInputMethodIconFileKey: haneul.tiff
        tsInputMethodCharacterRepertoireKey:
          - Hang
          - Kore
        ComponentInputModeDict:
          tsInputModeListKey:
            com.hyunjincho.inputmethod.haneul.korean:
              TISInputSourceID: com.hyunjincho.inputmethod.haneul.korean
              TISIntendedLanguage: ko
              TISIconLabels:
                Primary: 하늘
              KeyboardLayout: com.apple.inputmethod.Korean.2SetKorean
              tsInputModeScriptKey: smKorean
              tsInputModePrimaryInScriptKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeDefaultStateKey: true
              tsInputModeJISKeyboardShortcutKey: 0
              tsInputModeMenuIconFileKey: haneul.tiff
              tsInputModeAlternateMenuIconFileKey: haneul.tiff
              tsInputModePaletteIconFileKey: haneul.tiff
          tsVisibleInputModeOrderedArrayKey:
            - com.hyunjincho.inputmethod.haneul.korean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunjincho.inputmethod.haneul
        CODE_SIGN_ENTITLEMENTS: HaneulKeyboardIM.entitlements

schemes:
  HaneulKeyboard:
    build:
      targets:
        HaneulKeyboard: all
      postActions:
        - name: "Unregister build products from LaunchServices (dedup)"
          settingsTarget: HaneulKeyboard
          script: |
            # Scheme post-action은 Xcode의 RegisterWithLaunchServices 이후 실행한다.
            # 파일은 유지하고 빌드 산출물의 LaunchServices 등록만 해제한다.
            LSREG=/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister
            "$LSREG" -u "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
            "$LSREG" -u "${BUILT_PRODUCTS_DIR}/HaneulKeyboardIM.app" 2>/dev/null || true
            "$LSREG" -u "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/HaneulKeyboardIM.app" 2>/dev/null || true
            exit 0
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
