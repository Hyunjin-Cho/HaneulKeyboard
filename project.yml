name: HaneulKeyboard
options:
  bundleIdPrefix: com.hyunjincho
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "2026.9"
    CURRENT_PROJECT_VERSION: "110"
    HANEUL_RELEASE_SUFFIX: ""
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "YES"
      ENABLE_HARDENED_RUNTIME: "NO"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application: Hyunjin Cho (6RH6FXY82P)"
      DEVELOPMENT_TEAM: 6RH6FXY82P
      CODE_SIGNING_REQUIRED: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  HaneulKeyboard:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Shared
      # 2026-09-21 (#54): 되돌리기 키·앱별 끄기의 저장 키·후보·판정을 IME와 공유한다
      # (Foundation 전용 순수 파일 — 설정 앱과 IME가 같은 정의를 쓰는 단일 진실).
      - path: IMESources/RevertKey.swift
      - path: IMESources/AutoConvertPolicy.swift
      # 2026-11-06 (#157): 휴지통 판정을 입력기 쪽과 같은 정의로 쓴다.
      - path: IMESources/OrphanDecision.swift
      # 2026-09-21 (#53): 개인 사전의 키 이름·정규화·되돌리기 기록 형식을 설정 앱과 IME가
      # 한 파일로 공유한다(사본을 두면 반드시 어긋난다). Foundation 전용이라 양쪽 다 컴파일된다.
      - path: IMESources/PersonalDictionary.swift
      # 안내 입력칸도 실제 조합과 동일한 읽기 전용 변환 규칙·등록 사전을 관찰한다.
      - path: IMESources/HangulJamo.swift
      - path: IMESources/KeyboardLayout2Set.swift
      - path: IMESources/ManualToggle.swift
      - path: IMESources/EnglishParticleSplitter.swift
      - path: IMESources/KoreanComposer.swift
      - path: IMESources/Contractions.swift
      - path: IMESources/AlphanumericWords.swift
      - path: IMESources/MeasurementUnits.swift
      - path: IMESources/PhoneticDictionary.swift
      - path: IMESources/EnglishDetector.swift
      - path: IMESources/KoreanDictionary.swift
      - path: Resources/IM/phonetic_dictionary.json
        buildPhase: resources
      # 2026-11-02 (#111): 앱 아이콘 = Icon Composer 문서(.icon). Xcode가 actool로 컴파일해 Assets.car(macOS 26+ Liquid Glass)와
      # AppIcon.icns(macOS 14·15 대체)를 만든다. 원본은 비공개 haneul-art `icon-b/approved/v7_2026-11-02/AppIcon.icon`.
      # Resources/AppIcon.icns는 DMG 스크립트가 쓰는 사본으로만 남는다(앱 번들에는 컴파일 결과가 들어간다).
      - path: Resources/AppIcon.icon
        buildPhase: resources
        type: file
      - path: Resources/MenuBar
        buildPhase: resources
      - path: Resources/Onboarding
        buildPhase: resources
      - path: Resources/Settings
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: LICENSES/HaneulKeyboard-MIT-legacy.txt
        buildPhase: resources
      - path: ACKNOWLEDGEMENTS.md
        buildPhase: resources
    dependencies:
      - target: HaneulKeyboardIM
        embed: false
    postBuildScripts:
      - name: "Embed HaneulKeyboardIM into Contents/Helpers"
        # #84 · 2026-10-09: IME 사전만 바뀌어도 앱 안의 입력기 사본을 갱신한다.
        # 출력 디렉터리만 선언하면 증분 빌드에서 이전 사전이 남을 수 있다.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/HaneulKeyboardIM.app
        script: |
          set -e
          HELPERS_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS_DIR"
          SRC="${BUILT_PRODUCTS_DIR}/HaneulKeyboardIM.app"
          if [ -d "$SRC" ]; then
            rm -rf "$HELPERS_DIR/HaneulKeyboardIM.app"
            cp -R "$SRC" "$HELPERS_DIR/"
            echo "Embedded HaneulKeyboardIM.app → $HELPERS_DIR/"
          else
            echo "WARN: HaneulKeyboardIM.app not found at $SRC"
          fi
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        # 2026-11-06 (#163): 앱은 창 없이 뒤에 남으므로 메모리 할당기를 공간 우선으로 둔다. 설정 닫은 뒤 52MB → 32MB(검수 앱 실측, 서명·강화 런타임 포함).
        # man malloc에 없는 설정이라 macOS 판에 따라 무시될 수 있고, 무시돼도 해는 없다. 2026-11-06 (#169): 입력기에도 넣었다.
        LSEnvironment:
          MallocSpaceEfficient: "1"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleName: HaneulKeyboard
        CFBundleDisplayName: HaneulKeyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        HaneulReleaseSuffix: $(HANEUL_RELEASE_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright (c) 2026 Hyunjin Cho"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunjincho.haneulkeyboard
        CODE_SIGN_ENTITLEMENTS: HaneulKeyboard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HaneulKeyboardIM:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IMESources
      - path: Shared
      - path: Sources/BundleTrust.swift
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: LICENSES/HaneulKeyboard-MIT-legacy.txt
        buildPhase: resources
      - path: ACKNOWLEDGEMENTS.md
        buildPhase: resources
      # 2026-11-07 (#175): 입력기는 번들 사전을 english_bundled.txt로 찾는다. 그 입력일 뿐인 broad 전용 사전은 번들에 넣지 않는다.
      # curated 둘(english_supplement·english_common)은 런타임이 Set으로 읽으므로 그대로 들어간다.
      # 제외 목록은 scripts/test_bundle_dictionaries.py가 dict_work/dict_manifest.tsv와 대조한다.
      - path: Resources/IM
        buildPhase: resources
        excludes:
          - english_modern.txt
          - english_names.txt
          - english_names_extra.txt
          - english_sports_geo.txt
    info:
      path: Generated/IMInfo.plist
      properties:
        LSBackgroundOnly: true
        LSUIElement: true
        # 2026-11-06 (#169): 입력기도 메모리 할당기를 공간 우선으로 두고 후보 107에서 시험한다. 106 코드 벤치 9회(키 100만 개씩): 15.5 → 11.5MB, 키 지연 중앙값 4.38 → 4.50µs,
        # 1ms 넘는 튐 0회 → 9회 중 2회(1.1·2.7ms, 원인 못 봄). man malloc에 없는 설정이라 macOS 판에 따라 무시될 수 있다. 타자가 느려지면 이 설정을 뺀다.
        # 2026-11-07 (#175): broad 사전을 펼치지 않게 바꿔 사전 적재 뒤 벤치가 10.9 → 2.4MB가 됐다. 근거: dict_work/2026-11-07-english-inplace-audit.md.
        LSEnvironment:
          MallocSpaceEfficient: "1"
        CFBundleName: HaneulKeyboardIM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        HaneulReleaseSuffix: $(HANEUL_RELEASE_SUFFIX)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright (c) 2026 Hyunjin Cho"
        NSPrincipalClass: NSApplication
        InputMethodConnectionName: com.hyunjincho.inputmethod.haneul_Connection
        InputMethodServerControllerClass: HaneulInputController
        TISIntendedLanguage: ko
        TICapsLockLanguageSwitchCapable: true
        TISIconIsTemplate: true
        tsInputMethodIconFileKey: HaneulInputTemplate.png
        tsInputMethodAlternateIconFileKey: HaneulInputSelected.png
        tsInputMethodCharacterRepertoireKey:
          - Hang
          - Kore
        ComponentInputModeDict:
          tsInputModeListKey:
            com.hyunjincho.inputmethod.haneul.korean:
              TISInputSourceID: com.hyunjincho.inputmethod.haneul.korean
              TISIntendedLanguage: ko
              # #81 · 2026-10-18: modes with an alternate icon do not inherit the root
              # template flag. Declare it here so the system can tint the HUD image.
              TISIconIsTemplate: true
              TISIconLabels:
                Primary: 하늘
              KeyboardLayout: com.apple.inputmethod.Korean.2SetKorean
              tsInputModeScriptKey: smKorean
              tsInputModePrimaryInScriptKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeDefaultStateKey: true
              tsInputModeJISKeyboardShortcutKey: 0
              tsInputModeMenuIconFileKey: HaneulInputTemplate.png
              tsInputModeAlternateMenuIconFileKey: HaneulInputSelected.png
              # #81 · 2026-10-12: plain white glyph for the user's bright-on-blue request.
              # Preserve the separate menu badge; actual caret HUD color needs live verification.
              tsInputModePaletteIconFileKey: HaneulInputPaletteWhite.png
          tsVisibleInputModeOrderedArrayKey:
            - com.hyunjincho.inputmethod.haneul.korean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyunjincho.inputmethod.haneul
        CODE_SIGN_ENTITLEMENTS: HaneulKeyboardIM.entitlements
        # TIS icon keys name concrete PNG files; do not merge them into TIFFs.
        COMBINE_HIDPI_IMAGES: "NO"

schemes:
  HaneulKeyboard:
    build:
      targets:
        HaneulKeyboard: all
      postActions:
        - name: "Unregister build products from LaunchServices (dedup)"
          settingsTarget: HaneulKeyboard
          script: |
            # Scheme post-action은 Xcode의 RegisterWithLaunchServices 이후 실행한다.
            # 파일은 유지하고 빌드 산출물의 LaunchServices 등록만 해제한다.
            LSREG=/System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister
            "$LSREG" -u "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
            "$LSREG" -u "${BUILT_PRODUCTS_DIR}/HaneulKeyboardIM.app" 2>/dev/null || true
            "$LSREG" -u "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/HaneulKeyboardIM.app" 2>/dev/null || true
            exit 0
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
